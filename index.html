<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5C4D">
<title>Dashboard Omzet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  (function () {
    var el = document.documentElement, t = 'light', c = 'hutan', s = 'standar';
    try {
      t = localStorage.getItem('omzet_theme') || 'light';
      c = localStorage.getItem('omzet_color') || 'hutan';
      s = localStorage.getItem('omzet_style') || 'standar';
    } catch (e) {}
    el.setAttribute('data-theme', t);
    el.setAttribute('data-color', c);
    el.setAttribute('data-style', s);
  })();
</script>
<style>
/* =====================================================================
   DASAR  (terang)
   ===================================================================== */
:root{
  --brand:#0F5C4D; --hero:#0F5C4D; --accent:#C98A2B; --brand-ink:#FFFFFF;
  --bg:color-mix(in srgb, var(--hero) 9%, #FFFFFF);
  --surface:#FFFFFF;
  --surface-2:color-mix(in srgb, var(--hero) 4%, #FFFFFF);
  --line:color-mix(in srgb, var(--hero) 15%, #FFFFFF);
  --ink:color-mix(in srgb, var(--hero) 22%, #0B0F0E);
  --muted:#5F6B67;
  --good:#1B7F5C; --bad:#B3402F; --warn-bg:#FBF1DC; --warn-ink:#7A5212;
  --c1:var(--brand); --c2:var(--accent); --c3:#3E6FA3; --c4:#B3573F; --c5:#7B5A8C; --c6:#5BA89A; --c7:#B7C0BB;
  --focus:var(--accent);
  --r:16px; --rs:10px; --bw:1px; --bc:var(--line); --sh:none; --pad:18px; --gap:16px; --fs:14px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme: light;
}
[data-theme="dark"]{
  --brand-ink:#07110E;
  --bg:color-mix(in srgb, var(--hero) 18%, #050807);
  --surface:color-mix(in srgb, var(--hero) 28%, #0A0E0C);
  --surface-2:color-mix(in srgb, var(--hero) 38%, #0E1311);
  --line:color-mix(in srgb, var(--hero) 60%, #111815);
  --ink:#E8EFEC; --muted:#A3AFAB;
  --good:#4CC9A0; --bad:#F0806C; --warn-bg:#3A2E14; --warn-ink:#EBC274;
  --c3:#6E9FD6; --c4:#E07F66; --c5:#B28CC6; --c6:#8CD0C2; --c7:#55625D;
  color-scheme: dark;
}

/* ===== 10 TEMA WARNA ===== */
[data-color="hutan"]  {--brand:#0F5C4D; --hero:#0F5C4D; --accent:#C98A2B}
[data-color="hutan"][data-theme="dark"]  {--brand:#3CBF9E; --hero:#0F4A3E; --accent:#E3AE50}
[data-color="laut"]   {--brand:#1D4E89; --hero:#1D4E89; --accent:#E0A030}
[data-color="laut"][data-theme="dark"]   {--brand:#6AA8F0; --hero:#173E6E; --accent:#F0BE5A}
[data-color="anggur"] {--brand:#5B3A8C; --hero:#5B3A8C; --accent:#D98A3D}
[data-color="anggur"][data-theme="dark"] {--brand:#B190E8; --hero:#3F2766; --accent:#EDAA5E}
[data-color="marun"]  {--brand:#8C2F39; --hero:#8C2F39; --accent:#C9A13B}
[data-color="marun"][data-theme="dark"]  {--brand:#E8838D; --hero:#6B1F29; --accent:#E3C068}
[data-color="senja"]  {--brand:#C25A12; --hero:#C25A12; --accent:#1F6F78}
[data-color="senja"][data-theme="dark"]  {--brand:#F29A55; --hero:#8A3F0A; --accent:#4FB6C2}
[data-color="tosca"]  {--brand:#0E7490; --hero:#0E7490; --accent:#D9822B}
[data-color="tosca"][data-theme="dark"]  {--brand:#4FC3DE; --hero:#0B5568; --accent:#EFA457}
[data-color="mawar"]  {--brand:#B03A6B; --hero:#B03A6B; --accent:#3A7F6B}
[data-color="mawar"][data-theme="dark"]  {--brand:#F08CB4; --hero:#7E2548; --accent:#6CC4AB}
[data-color="kopi"]   {--brand:#6B4423; --hero:#6B4423; --accent:#B8862F}
[data-color="kopi"][data-theme="dark"]   {--brand:#D4A574; --hero:#4F321A; --accent:#E6BC6A}
[data-color="baja"]   {--brand:#3F4E5C; --hero:#3F4E5C; --accent:#D08A2E}
[data-color="baja"][data-theme="dark"]   {--brand:#9FB3C4; --hero:#2E3944; --accent:#E9AE5C}
[data-color="indigo"] {--brand:#3730A3; --hero:#3730A3; --accent:#E0A32E}
[data-color="indigo"][data-theme="dark"] {--brand:#8F8BF0; --hero:#2A2478; --accent:#F0C060}

/* ===== 10 MODEL TAMPILAN ===== */
[data-style="lembut"]{--r:26px; --rs:14px; --bw:0px; --sh:0 10px 30px -14px rgba(0,0,0,.28)}
[data-style="tegas"]{--r:4px; --rs:3px; --bw:2px; --bc:var(--ink); --sh:5px 5px 0 var(--ink)}
[data-style="kompak"]{--r:10px; --rs:8px; --pad:12px; --gap:10px; --fs:13px}
[data-style="luas"]{--r:22px; --rs:12px; --pad:26px; --gap:24px; --fs:15px}
[data-style="datar"]{--r:8px; --rs:6px; --bw:0px; --sh:none}
[data-style="kaca"]{--r:20px; --rs:12px; --sh:0 8px 30px -16px rgba(0,0,0,.35)}
[data-style="kaca"] body{background:linear-gradient(135deg, color-mix(in srgb, var(--brand) 30%, var(--bg)), var(--bg) 62%) fixed}
[data-style="kaca"] .card,[data-style="kaca"] .login-card,[data-style="kaca"] .modal{
  background:color-mix(in srgb, var(--surface) 68%, transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
}
[data-style="klasik"]{--r:2px; --rs:2px; --bc:var(--ink); --font:Georgia,'Times New Roman',serif}
[data-style="satu"] .s3,[data-style="satu"] .s4,[data-style="satu"] .s5,[data-style="satu"] .s7,[data-style="satu"] .s8,[data-style="satu"] .s12{grid-column:span 12}
[data-style="satu"] .kpi.s3{grid-column:span 6}
[data-style="satu"] .hero{min-height:0}
[data-style="satu"] .app{max-width:760px}
[data-style="majalah"] .hero{grid-column:span 12; flex-direction:row; align-items:flex-end; justify-content:space-between; min-height:0; flex-wrap:wrap}
[data-style="majalah"] .hero dl{border-top:0; border-left:1px solid rgba(255,255,255,.22); padding:0 0 0 26px; min-width:280px}
[data-style="majalah"] .hero .val{font-size:clamp(34px,5vw,56px)}
[data-style="majalah"] .card.s8{grid-column:span 12}
[data-style="majalah"] .card.s7,[data-style="majalah"] .card.s5{grid-column:span 6}

/* =====================================================================
   UMUM
   ===================================================================== */
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font);
  font-size:var(--fs); line-height:1.5; font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* ---------- indikator memuat ---------- */
.loadbar{position:fixed; inset:0 0 auto 0; height:3px; z-index:90; overflow:hidden; background:transparent}
.loadbar i{display:block; height:100%; width:35%; background:var(--accent); animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}

/* ---------- login ---------- */
.login{
  min-height:100vh; display:grid; place-items:center; padding:24px;
  background-color:var(--bg);
  background-image:repeating-linear-gradient(to bottom, transparent 0 39px, var(--line) 39px 40px);
}
.login-gear{position:fixed; top:14px; right:14px; z-index:5}
.login-card{
  width:100%; max-width:360px; background:var(--surface); border:var(--bw) solid var(--bc);
  border-radius:calc(var(--r) + 8px); padding:32px 28px 28px; text-align:center; box-shadow:var(--sh);
}
.mark{width:48px; height:48px; border-radius:calc(var(--rs) + 4px); background:var(--hero); color:#fff; display:grid; place-items:center; margin:0 auto 16px}
.mark.sm{width:36px; height:36px; border-radius:calc(var(--rs) + 1px); margin:0}
.login h1{margin:0 0 4px; font-size:22px; font-weight:800; letter-spacing:-.01em}
.login .sub{margin:0 0 22px; color:var(--muted)}
.dots{display:flex; justify-content:center; gap:12px; min-height:16px; margin-bottom:10px}
.dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--line); transition:background .12s, border-color .12s}
.dots i.on{background:var(--brand); border-color:var(--brand)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.err{min-height:20px; margin:0 0 14px; color:var(--bad); font-weight:600; font-size:13px}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.pad button{
  height:58px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface-2);
  font-size:20px; font-weight:600; cursor:pointer; transition:background .12s, transform .06s;
}
.pad button:hover{background:var(--line)}
.pad button:active{transform:scale(.96)}
.pad button.go{background:var(--brand); border-color:var(--brand); color:var(--brand-ink); font-size:15px; font-weight:700}
.pad button.go:hover{filter:brightness(1.08)}
.pad button.del{font-size:16px; color:var(--muted)}
.pad button:disabled{opacity:.5; cursor:wait}

/* ---------- aplikasi ---------- */
.app{max-width:1280px; margin:0 auto; padding:20px 20px 56px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px}
.brand-name{font-weight:800; font-size:18px; letter-spacing:-.01em; line-height:1.2}
.brand-sub{color:var(--muted); font-size:12px}
.actions{display:flex; gap:8px}
.btn{
  display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 14px; border-radius:var(--rs);
  background:var(--surface); border:1px solid var(--line); cursor:pointer; font-weight:600; font-size:13px;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn.icon{width:38px; padding:0; justify-content:center}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{flex:none}

.card{background:var(--surface); border:var(--bw) solid var(--bc); border-radius:var(--r); padding:var(--pad); box-shadow:var(--sh)}

/* ---------- FILTER (DIPERBAIKI) ---------- */
.filters{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr 1.6fr auto;
  gap:12px;
  align-items:end;
  margin-bottom:var(--gap);
}
.field{min-width:0}
.field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px}
.field input,.field select{
  width:100%; max-width:100%; height:40px; padding:0 12px; border-radius:var(--rs);
  border:1px solid var(--line); background:var(--surface-2); outline:none;
  box-sizing:border-box;
}
.field input:focus,.field select:focus{border-color:var(--brand)}
.filters > .btn{height:40px}

.banner{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--rs); margin-bottom:var(--gap); font-size:13px; background:var(--warn-bg); color:var(--warn-ink)}
.banner b{font-weight:700}

.grid{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:var(--gap)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}

.hero{
  background:var(--hero); color:#fff; border-radius:calc(var(--r) + 6px); padding:calc(var(--pad) + 8px);
  display:flex; flex-direction:column; justify-content:space-between; gap:22px; min-height:340px;
  box-shadow:var(--sh);
}
.hero .lbl{font-size:13px; font-weight:600; opacity:.8}
.hero .val{font-size:clamp(28px,3.4vw,40px); font-weight:800; letter-spacing:-.02em; line-height:1.1; margin:6px 0 10px; word-break:break-word}
.hero .per{font-size:13px; opacity:.8}
.chip{display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:700; background:rgba(255,255,255,.16); margin-top:12px}
.chip.up{background:#D5F2E4; color:#0B5A3D}
.chip.down{background:#F8DDD7; color:#8E2E1F}
.hero dl{margin:0; display:grid; gap:10px; border-top:1px solid rgba(255,255,255,.18); padding-top:16px}
.hero dl div{display:flex; justify-content:space-between; gap:12px; font-size:13px}
.hero dt{opacity:.75}
.hero dd{margin:0; font-weight:700; text-align:right}

.kpi .k-l{font-size:12px; font-weight:600; color:var(--muted)}
.kpi .k-v{font-size:22px; font-weight:800; letter-spacing:-.01em; margin:6px 0 2px; word-break:break-word}
.kpi .k-f{font-size:12px; color:var(--muted)}
.kpi{border-left:4px solid var(--c2)}
.kpi.b2{border-left-color:var(--c3)}
.kpi.b3{border-left-color:var(--c4)}
.kpi.b4{border-left-color:var(--c5)}

.card-h{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.card-h h2{margin:0; font-size:15px; font-weight:700}
.card-h p{margin:2px 0 0; color:var(--muted); font-size:12px}
.chart-box{position:relative; height:290px}
.chart-box.tall{height:340px}
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--rs); padding:3px}
.seg button{border:0; background:transparent; height:28px; padding:0 12px; border-radius:calc(var(--rs) - 2px); font-size:12px; font-weight:600; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line)}

/* ---------- tabel ---------- */
.tbl-wrap{overflow-x:auto; margin:0 calc(var(--pad) * -1); padding:0 var(--pad); -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; min-width:720px}
th,td{padding:11px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:12px; font-weight:700; color:var(--muted); background:transparent}
th .th{background:none; border:0; padding:0; cursor:pointer; font-weight:700; color:inherit; display:inline-flex; gap:4px; align-items:center}
th .th:hover{color:var(--ink)}
th.num,td.num{text-align:right}
td.cust{max-width:340px; overflow:hidden; text-overflow:ellipsis}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:800; border-bottom:0; border-top:2px solid var(--ink); background:var(--surface-2)}
.bar{display:inline-block; vertical-align:middle; width:70px; height:6px; border-radius:3px; background:var(--surface-2); margin-right:8px; overflow:hidden; border:1px solid var(--line)}
.bar i{display:block; height:100%; background:var(--c1)}
.tag{display:inline-block; margin-left:8px; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--warn-bg); color:var(--warn-ink)}
.pager{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap; color:var(--muted); font-size:13px}
.pager .btn{height:34px}
.pager .btn:disabled{opacity:.45; cursor:default}
.note{margin:12px 0 0; font-size:12px; color:var(--muted)}

.empty{text-align:center; padding:56px 20px}
.empty h2{margin:0 0 6px; font-size:18px}
.empty p{margin:0 auto; max-width:460px; color:var(--muted)}

.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:11px 18px; border-radius:12px; font-weight:600; font-size:13px; z-index:95; max-width:92vw;
}

/* ---------- pengaturan ---------- */
.modal-back{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:80; display:grid; place-items:center; padding:16px}
.modal{
  width:100%; max-width:600px; max-height:90vh; overflow:auto; background:var(--surface);
  border:var(--bw) solid var(--bc); border-radius:var(--r); padding:20px; box-shadow:0 20px 60px -20px rgba(0,0,0,.5);
}
.modal-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.modal-h h2{margin:0; font-size:18px; font-weight:800}
.modal h3{margin:20px 0 4px; font-size:13px; font-weight:700}
.modal .hint{margin:0 0 10px; color:var(--muted); font-size:12px}
.swatches{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.sw{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border-radius:var(--rs);
  border:2px solid transparent; background:var(--surface-2); cursor:pointer; font-size:11px; font-weight:600; text-align:center; line-height:1.25;
}
.sw i{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg, var(--a) 0 60%, var(--b) 60%); box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.sw:hover{background:var(--line)}
.sw[aria-pressed="true"]{border-color:var(--brand); background:var(--surface)}
.styles{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.opt{
  display:block; text-align:left; padding:10px 12px; border-radius:var(--rs); border:2px solid transparent;
  background:var(--surface-2); cursor:pointer;
}
.opt b{display:block; font-size:13px}
.opt span{display:block; font-size:11px; color:var(--muted); margin-top:1px}
.opt:hover{background:var(--line)}
.opt[aria-pressed="true"]{border-color:var(--brand); background:var(--surface)}
.modal-f{display:flex; justify-content:space-between; gap:8px; margin-top:20px; flex-wrap:wrap}

/* ---------- responsif ---------- */

/* Tablet / layar sedang */
@media (max-width:1000px){
  .filters{grid-template-columns:1fr 1fr}
  .filters .field.q{grid-column:span 2}
  .filters > .btn{grid-column:span 2; width:100%; justify-content:center}
  .s3{grid-column:span 6}
  .s4,.s5,.s7,.s8{grid-column:span 12}
  .hero{min-height:0}
  [data-style="majalah"] .hero{flex-direction:column; align-items:stretch}
  [data-style="majalah"] .hero dl{border-left:0; border-top:1px solid rgba(255,255,255,.22); padding:16px 0 0; min-width:0}
  [data-style="majalah"] .card.s7,[data-style="majalah"] .card.s5{grid-column:span 12}
}

/* HP / HP kecil — filter full 1 kolom, semua rata kiri-kanan */
@media (max-width:560px){
  .app{padding:14px 12px 40px}

  /* Filter jadi 1 kolom supaya semua field rata kanan-kiri */
  .filters{
    grid-template-columns:1fr !important;
    gap:10px;
    padding:14px;
  }
  .filters .field,
  .filters .field.q{grid-column:auto !important; width:100%}
  .filters > .btn{
    grid-column:auto !important;
    width:100%;
    justify-content:center;
  }

  .s3{grid-column:span 12}
  .btn .t{display:none}
  .btn{padding:0 11px}
  .seg button{padding:0 9px; font-size:11.5px}
  .swatches{grid-template-columns:repeat(3,1fr)}
  .styles{grid-template-columns:1fr}

  /* tabel: kurangi margin negatif di HP supaya tidak melewati card */
  .tbl-wrap{margin:0; padding:0}

  .pager{justify-content:center; text-align:center}
  .pager > span:last-child{display:flex; gap:8px; width:100%}
  .pager .btn{flex:1; justify-content:center}
}

/* HP sangat kecil */
@media (max-width:380px){
  .app{padding:12px 10px 36px}
  .filters{padding:12px}
  .field label{font-size:11.5px}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>

<div class="loadbar" id="loadbar" hidden><i></i></div>

<!-- ===================== LOGIN ===================== -->
<main class="login" id="login" hidden>
  <button class="btn icon login-gear" id="btnSettingsLogin" type="button" aria-label="Pengaturan tampilan">
